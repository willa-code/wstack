name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      phase:
        description: Select the explicitly authorized release phase
        required: true
        type: choice
        options: [version-pr, tag-release]
      version_pr:
        description: Merged version/bootstrap PR number (required for tag-release)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  version-pr:
    name: Prepare or update version PR
    if: github.event_name == 'push' || inputs.phase == 'version-pr'
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build the generated release branch
        run: |
          git fetch origin release/version:refs/remotes/origin/release/version || true
          git switch --force-create release/version origin/main
          npm run version
          npm install --package-lock-only --ignore-scripts
          npm run verify
      - name: Push and open or update the version PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json package-lock.json .changeset scripts/verification/skill-catalog.json skills/setup-wstack/scripts/runtime/runtime-manifest.json skills/setup-wstack/scripts/runtime/version.mjs
          if git diff --cached --quiet; then
            echo "No pending Changesets produced a version diff."
            exit 0
          fi
          git commit --message "chore: version wstack"
          git push --force-with-lease --set-upstream origin release/version
          existing="$(gh pr list --base main --head release/version --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "Updated version PR #${existing}"
          elif ! gh pr create --base main --head release/version --title "chore: version wstack" --body "Generated by Changesets. Review and merge this version PR before authorizing tag-release."; then
            echo "Version branch pushed to origin/release/version, but the Actions bot could not open the PR."
            echo "This repository blocks the Actions bot from creating pull requests (GraphQL createPullRequest not permitted)."
            echo "Manual fallback (user auth, no settings change): gh pr create --base main --head release/version --title 'chore: version wstack'"
            exit 1
          fi

  tag-release:
    name: Create immutable tag and GitHub Release
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'tag-release'
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Install and verify the exact release commit
        run: |
          npm ci --ignore-scripts
          npm run verify
          test -z "$(git status --porcelain)"
      - name: Prove release provenance
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_PR: ${{ inputs.version_pr }}
        run: |
          test -n "$VERSION_PR"
          pr_state="$(gh pr view "$VERSION_PR" --json state,baseRefName,mergedAt,mergeCommit --jq '[.state,.baseRefName,.mergedAt,.mergeCommit.oid] | @tsv')"
          IFS=$'\t' read -r state base merged_at merge_sha <<<"$pr_state"
          test "$state" = MERGED
          test "$base" = main
          test -n "$merged_at"
          test "$merge_sha" = "$(git rev-parse HEAD)"
          gh pr checks "$VERSION_PR" --json name,state | node scripts/release/verify-pr-checks.mjs
      - name: Create or safely resume the immutable annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          direct="$(git ls-remote --tags origin "refs/tags/${tag}")"
          peeled="$(git ls-remote --tags origin "refs/tags/${tag}^{}")"
          if [ -n "$direct" ]; then
            test -n "$peeled"
            remote_commit="${peeled%%[[:space:]]*}"
            test "$remote_commit" = "$(git rev-parse HEAD)"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$tag" --message "wstack ${version}"
            git push origin "$tag"
          fi
          echo "tag=${tag}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_ENV"
      - name: Verify installation from the exact remote tag
        run: node scripts/verification/verify-sandbox.mjs --network --source "willa-code/wstack#${tag}"
      - name: Create or confirm the canonical GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/extract-notes.mjs "$version" "$RUNNER_TEMP/release-notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists."
          else
            gh release create "$tag" --verify-tag --title "wstack ${version}" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
