name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests, including forks, run without write authority or release secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-node:
    name: Core verification (Node 20, macOS)
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify the minimum runtime
        run: npm run verify:core

  full:
    name: Full verification (Node 22.20, macOS)
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run release-equivalent verification
        run: npm run verify

  latest-installer:
    name: Latest installer compatibility (release-relevant changes)
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Identify release-relevant changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/verification/change-scope.mjs
      - name: Set up Node.js
        if: steps.scope.outputs.release_relevant == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Install locked dependencies
        if: steps.scope.outputs.release_relevant == 'true'
        run: npm ci --ignore-scripts
      - name: Verify against skills@latest
        if: steps.scope.outputs.release_relevant == 'true'
        run: npm run verify:latest
